[project]
name = "dwyt-central"
version = "0.9.3"
description = "dwyt central service: web UI, sign-in, per-user libraries, job queue for runners"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "segno>=1.6",
  "httpx>=0.27",
  "cryptography>=42",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
# the embedding service (dwyt-central-embed); install torch's CPU build first (docs/telepites.md)
embed = ["sentence-transformers>=3.0"]

[project.scripts]
dwyt-central = "central.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["central*"]

[tool.setuptools.package-data]
central = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
