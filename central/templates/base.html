<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
<title>{% block title %}dwyt{% endblock %} · dwyt</title>
<link rel="stylesheet" href="{{ asset('style.css') }}">
<script src="{{ asset('htmx.min.js') }}" defer></script>
<script src="{{ asset('app.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}' data-csrf="{{ csrf }}">
{% if viewer %}
<header class="top">
  <a class="brand" href="/">dwyt</a>
  <nav>
    <a href="/">Könyvtár</a>
    <a href="/kereses">Keresés</a>
    <a href="/uj">Új átirat</a>
    <a href="/munkak">Munkák</a>
    <a href="/futtatok">Futtatók</a>
    <a href="/beallitasok">Beállítások</a>
    {% if viewer.is_admin %}<a href="/admin">Admin</a>{% endif %}
  </nav>
  <span class="muted">{{ viewer.name or viewer.email }}</span>
  <form method="post" action="/kilepes" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <button class="link">Kilépés</button>
  </form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
