# /etc/fail2ban/filter.d/dwyt.conf (on the Apache host)
# Failed admin password/code logins (401) and requests the central service rate-limited (429).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /admin-belepes(?:/kod)? HTTP/[0-9.]+" 401
            ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 429
ignoreregex =
