# Apache reverse proxy for the dwyt central service (on the Apache host, e.g. /etc/apache2/sites-available/dwyt.conf)
# Needs: a2enmod ssl proxy proxy_http headers; certificate: certbot --apache -d dwyt.iodate.date
<VirtualHost *:80>
    ServerName dwyt.iodate.date
    Redirect permanent / https://dwyt.iodate.date/
</VirtualHost>

<VirtualHost *:443>
    ServerName dwyt.iodate.date
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dwyt.iodate.date/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dwyt.iodate.date/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    # long-polling runners wait up to 25 s; results of long transcripts can be several MB
    ProxyTimeout 120
    LimitRequestBody 104857600
    # browser uploads of own recordings (UPLOAD_MAX_MB, at most 2000 MB with this limit)
    <Location /feltoltes>
        LimitRequestBody 2147483647
    </Location>
    ProxyPass        / http://DWYT-IP:8000/
    ProxyPassReverse / http://DWYT-IP:8000/

    # Own log, read by fail2ban (deploy/fail2ban): failed admin logins answer 401, rate limits 429
    ErrorLog  ${APACHE_LOG_DIR}/dwyt-error.log
    CustomLog ${APACHE_LOG_DIR}/dwyt-access.log combined

    # To allow only the home network and the VPN (e.g. while testing), uncomment and fill in
    # real ranges; a placeholder left in makes Apache refuse the whole configuration:
    # <Location />
    #     Require ip 192.168.1.0/24 10.8.0.0/24
    # </Location>
</VirtualHost>
